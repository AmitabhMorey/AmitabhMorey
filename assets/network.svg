<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" width="100%" height="100%">
  <defs>
    <style>
      <![CDATA[
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');

        .font-mono { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }

        .c-bg { fill: #0D1117; }
        .c-surface { fill: #161B22; }
        .c-text { fill: #F5F5F5; }
        .c-muted { fill: #8B949E; }
        .c-dim { fill: #484F58; }
        .c-accent { fill: #D2A8FF; } /* Accent 4: Purple */
      ]]>
    </style>
  </defs>

  <rect width="1600" height="360" class="c-bg"/>

  <!-- Outer Window Container -->
  <rect x="30" y="20" width="1540" height="320" rx="8" class="c-surface" stroke="#30363D" stroke-width="1.5"/>

  <!-- Header Bar -->
  <path d="M 30 28 A 8 8 0 0 1 38 20 L 1562 20 A 8 8 0 0 1 1570 28 L 1570 54 L 30 54 Z" fill="#0D1117"/>
  <line x1="30" y1="54" x2="1570" y2="54" stroke="#30363D" stroke-width="1.5"/>
  <text x="50" y="42" class="font-mono c-accent" font-size="12" font-weight="bold">LAZYGIT // RECENT COMMIT LOG &amp; ACTIVITY TELEMETRY</text>
  <text x="1550" y="42" class="font-mono c-muted" font-size="11" text-anchor="end">BRANCH: MAIN [365 DAY STREAK]</text>

  <!-- Left: Git Commit History Output -->
  <g transform="translate(60, 80)" class="font-mono" font-size="13">
    <text x="0" y="0" class="c-muted" font-size="11">// RECENT COMMITS (LOG VIEW)</text>

    <!-- Commit 1 -->
    <g transform="translate(0, 25)">
      <text x="0" y="0"><tspan class="c-accent" font-weight="bold">a8f10b2</tspan> <tspan class="c-muted">[main]</tspan> <tspan class="c-text">feat(core): implement eBPF packet filter ring buffer</tspan></text>
      <text x="760" y="0" class="c-dim" text-anchor="end">2 hours ago</text>
    </g>

    <!-- Commit 2 -->
    <g transform="translate(0, 60)">
      <text x="0" y="0"><tspan class="c-accent" font-weight="bold">3c91a04</tspan> <tspan class="c-muted">[main]</tspan> <tspan class="c-text">fix(security): sanitize input buffer in packet parser</tspan></text>
      <text x="760" y="0" class="c-dim" text-anchor="end">1 day ago</text>
    </g>

    <!-- Commit 3 -->
    <g transform="translate(0, 95)">
      <text x="0" y="0"><tspan class="c-accent" font-weight="bold">9e71d3a</tspan> <tspan class="c-muted">[main]</tspan> <tspan class="c-text">refactor(net): optimize zero-copy socket queue allocation</tspan></text>
      <text x="760" y="0" class="c-dim" text-anchor="end">3 days ago</text>
    </g>

    <!-- Commit 4 -->
    <g transform="translate(0, 130)">
      <text x="0" y="0"><tspan class="c-accent" font-weight="bold">5f18c21</tspan> <tspan class="c-muted">[main]</tspan> <tspan class="c-text">docs(kernel): update architecture specification diagram</tspan></text>
      <text x="760" y="0" class="c-dim" text-anchor="end">5 days ago</text>
    </g>

    <!-- Commit 5 -->
    <g transform="translate(0, 165)">
      <text x="0" y="0"><tspan class="c-accent" font-weight="bold">7d90e43</tspan> <tspan class="c-muted">[main]</tspan> <tspan class="c-text">ci(actions): harden build matrix pipeline &amp; static analysis</tspan></text>
      <text x="760" y="0" class="c-dim" text-anchor="end">1 week ago</text>
    </g>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="860" y1="70" x2="860" y2="300" stroke="#30363D" stroke-dasharray="4 4"/>

  <!-- Right: Activity Telemetry Matrix Box -->
  <g transform="translate(900, 80)" class="font-mono" font-size="13">
    <text x="0" y="0" class="c-muted" font-size="11">// ANNUAL ACTIVITY MATRIX TELEMETRY</text>

    <!-- Commit Stats Summary -->
    <g transform="translate(0, 30)">
      <text x="0" y="0"><tspan class="c-muted">Total Commits (Year)</tspan><tspan class="c-dim">......</tspan> <tspan class="c-accent" font-weight="bold">1,420+ commits</tspan></text>
      <text x="0" y="25"><tspan class="c-muted">Current Streak</tspan><tspan class="c-dim">............</tspan> <tspan class="c-text">365 days unbroken</tspan></text>
      <text x="0" y="50"><tspan class="c-muted">Active Repositories</tspan><tspan class="c-dim">.......</tspan> <tspan class="c-text">31 projects</tspan></text>
    </g>

    <!-- Monospace Matrix Representation -->
    <g transform="translate(0, 120)">
      <text x="0" y="0" class="c-dim" font-size="11">COMMIT DENSITY LOG (JAN - DEC)</text>

      <g transform="translate(0, 15)" font-size="12">
        <text x="0" y="0" class="c-accent">■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■</text>
        <text x="0" y="20" class="c-accent">■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■</text>
        <text x="0" y="40" class="c-muted">■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■</text>
        <text x="0" y="60" class="c-dim">■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■ ■</text>
      </g>
    </g>
  </g>
</svg>
