<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650" width="100%" height="100%">
  <defs>
    <style>
      <![CDATA[
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');

        .font-mono { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }

        .c-bg { fill: #0D1117; }
        .c-surface { fill: #161B22; }
        .c-border { stroke: #30363D; stroke-width: 1; }
        .c-text { fill: #F5F5F5; }
        .c-muted { fill: #8B949E; }
        .c-dim { fill: #484F58; }
        .c-accent { fill: #58A6FF; }

        @keyframes cursorBlink {
          0%, 49% { opacity: 1; }
          50%, 100% { opacity: 0; }
        }

        @keyframes loadProgress {
          0% { width: 0px; }
          100% { width: 420px; }
        }

        .cursor { animation: cursorBlink 1s infinite; }
        .bar-fill { animation: loadProgress 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
      ]]>
    </style>

    <pattern id="subtleScan" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="1600" height="650" class="c-bg"/>

  <!-- Terminal Window Frame -->
  <rect x="30" y="30" width="1540" height="590" rx="8" class="c-surface" stroke="#30363D" stroke-width="1.5"/>

  <!-- Terminal Header Bar (Ghostty / Tmux Style) -->
  <path d="M 30 38 A 8 8 0 0 1 38 30 L 1562 30 A 8 8 0 0 1 1570 38 L 1570 70 L 30 70 Z" fill="#0D1117"/>
  <line x1="30" y1="70" x2="1570" y2="70" stroke="#30363D" stroke-width="1.5"/>

  <!-- Terminal Window Buttons -->
  <circle cx="55" cy="50" r="5.5" fill="#FF5F56"/>
  <circle cx="73" cy="50" r="5.5" fill="#FFBD2E"/>
  <circle cx="91" cy="50" r="5.5" fill="#27C93F"/>

  <!-- Tmux Window Tabs -->
  <g transform="translate(130, 40)">
    <rect x="0" y="0" width="140" height="22" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="12" y="15" class="font-mono c-accent" font-size="12" font-weight="500">1:zsh*</text>

    <rect x="150" y="0" width="120" height="22" rx="4" fill="#0D1117"/>
    <text x="162" y="15" class="font-mono c-muted" font-size="12">2:nvim</text>

    <rect x="280" y="0" width="130" height="22" rx="4" fill="#0D1117"/>
    <text x="292" y="15" class="font-mono c-muted" font-size="12">3:lazygit</text>
  </g>

  <text x="1540" y="54" class="font-mono c-dim" font-size="12" text-anchor="end">80x24 — UTF-8</text>

  <!-- ================= TERMINAL CONTENT ================= -->

  <g transform="translate(70, 110)">

    <!-- Command prompt entry -->
    <text x="0" y="20" class="font-mono" font-size="14">
      <tspan class="c-accent" font-weight="bold">amitabh@os</tspan><tspan class="c-muted">:</tspan><tspan fill="#58A6FF">~/profile</tspan><tspan class="c-muted"> $</tspan> <tspan class="c-text">cat hero.asc</tspan>
    </text>

    <!-- ASCII Art block (exact as requested) -->
    <g transform="translate(0, 45)" class="font-mono c-text" font-size="15" xml:space="preserve">
      <text x="0" y="0" class="c-muted">██████████████████████████████████████████████████████████████████████</text>

      <text x="40" y="32" class="c-accent">        █████╗ ███╗   ███╗</text>
      <text x="40" y="52" class="c-accent">       ██╔══██╗████╗ ████║</text>
      <text x="40" y="72" class="c-accent">       ███████║██╔████╔██║</text>
      <text x="40" y="92" class="c-accent">       ██╔══██║██║╚██╔╝██║</text>
      <text x="40" y="112" class="c-accent">       ██║  ██║██║ ╚═╝ ██║</text>

      <text x="40" y="150" class="c-text" font-size="20" font-weight="bold" letter-spacing="6">  A M I T A B H   M O R E Y</text>

      <text x="40" y="190" class="c-muted" font-size="14">Software Engineer   <tspan class="c-accent">│</tspan>   Cybersecurity   <tspan class="c-accent">│</tspan>   Open Source   <tspan class="c-accent">│</tspan>   Linux</text>

      <text x="0" y="225" class="c-muted">██████████████████████████████████████████████████████████████████████</text>
    </g>

    <!-- Boot sequence & progress output -->
    <g transform="translate(0, 310)">
      <text x="0" y="0" class="font-mono c-accent" font-size="14">&gt; booting profile...</text>
      <text x="0" y="25" class="font-mono c-muted" font-size="14">Loading modules...</text>

      <!-- Terminal Progress Bar -->
      <g transform="translate(0, 45)">
        <text x="0" y="15" class="font-mono c-text" font-size="14">
          [<tspan class="c-accent">███████████████████████████████</tspan><tspan class="c-dim">░░░░░░░░░░░</tspan>]  <tspan class="c-accent" font-weight="bold">74%</tspan>
        </text>
      </g>
    </g>

    <!-- Next prompt line with active cursor -->
    <g transform="translate(0, 430)">
      <text x="0" y="0" class="font-mono" font-size="14">
        <tspan class="c-accent" font-weight="bold">amitabh@os</tspan><tspan class="c-muted">:</tspan><tspan fill="#58A6FF">~/profile</tspan><tspan class="c-muted"> $</tspan> <tspan class="c-text">exec ./init_environment.sh</tspan><tspan class="cursor c-accent">█</tspan>
      </text>
    </g>

  </g>

  <!-- Tiny Fox Assistant Mascot (Discreetly placed in bottom right corner of frame) -->
  <g transform="translate(1420, 520)">
    <rect width="110" height="75" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
    <!-- Micro Fox -->
    <g transform="translate(15, 12)">
      <polygon points="15,20 8,5 25,12" fill="none" stroke="#8B949E" stroke-width="1.5"/>
      <polygon points="45,20 52,5 35,12" fill="none" stroke="#8B949E" stroke-width="1.5"/>
      <polygon points="30,42 10,20 50,20" fill="none" stroke="#8B949E" stroke-width="1.5"/>
      <circle cx="22" cy="24" r="2.5" fill="#58A6FF"/>
      <circle cx="38" cy="24" r="2.5" fill="#58A6FF"/>
    </g>
    <text x="55" y="64" class="font-mono c-dim" font-size="9" text-anchor="middle">fox-cli v1.0</text>
  </g>

  <!-- Very subtle CRT scanlines layer -->
  <rect x="30" y="30" width="1540" height="590" rx="8" fill="url(#subtleScan)" pointer-events="none"/>
</svg>
