<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 440" width="100%" height="100%">
  <defs>
    <style>
      <![CDATA[
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');

        .font-mono { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }

        .c-bg { fill: #0D1117; }
        .c-surface { fill: #161B22; }
        .c-text { fill: #F5F5F5; }
        .c-muted { fill: #8B949E; }
        .c-dim { fill: #30363D; }
        .c-accent { fill: #FFB86B; } /* Accent 3: Orange / Gold */
      ]]>
    </style>
  </defs>

  <rect width="1600" height="440" class="c-bg"/>

  <!-- Terminal Window Outer Frame -->
  <rect x="30" y="20" width="1540" height="400" rx="8" class="c-surface" stroke="#30363D" stroke-width="1.5"/>

  <!-- Header Bar -->
  <path d="M 30 28 A 8 8 0 0 1 38 20 L 1562 20 A 8 8 0 0 1 1570 28 L 1570 54 L 30 54 Z" fill="#0D1117"/>
  <line x1="30" y1="54" x2="1570" y2="54" stroke="#30363D" stroke-width="1.5"/>
  <text x="50" y="42" class="font-mono c-accent" font-size="12" font-weight="bold">SKILL MATRIX // TERMINAL PROGRESS BARS</text>
  <text x="1550" y="42" class="font-mono c-muted" font-size="11" text-anchor="end">STATUS: ACTIVE ARSENAL</text>

  <!-- Progress Bars List -->
  <g transform="translate(70, 95)" class="font-mono" font-size="14">

    <!-- Item 1: Python -->
    <g transform="translate(0, 0)">
      <text x="0" y="16" class="c-text" font-weight="500">Python</text>
      <text x="180" y="16" stroke-width="0">
        <tspan class="c-accent">█████████████████████████████████████</tspan><tspan class="c-dim">░░░░░░</tspan>
      </text>
      <text x="1400" y="16" class="c-accent" font-weight="bold" text-anchor="end">88%</text>
    </g>

    <!-- Item 2: Linux -->
    <g transform="translate(0, 45)">
      <text x="0" y="16" class="c-text" font-weight="500">Linux</text>
      <text x="180" y="16">
        <tspan class="c-accent">████████████████████████████████████████</tspan><tspan class="c-dim">░░░</tspan>
      </text>
      <text x="1400" y="16" class="c-accent" font-weight="bold" text-anchor="end">94%</text>
    </g>

    <!-- Item 3: Docker -->
    <g transform="translate(0, 90)">
      <text x="0" y="16" class="c-text" font-weight="500">Docker</text>
      <text x="180" y="16">
        <tspan class="c-accent">██████████████████████████████████</tspan><tspan class="c-dim">░░░░░░░░9%</tspan>
      </text>
      <text x="1400" y="16" class="c-accent" font-weight="bold" text-anchor="end">80%</text>
    </g>

    <!-- Item 4: Networking -->
    <g transform="translate(0, 135)">
      <text x="0" y="16" class="c-text" font-weight="500">Networking</text>
      <text x="180" y="16">
        <tspan class="c-accent">████████████████████████████████████</tspan><tspan class="c-dim">░░░░░░░</tspan>
      </text>
      <text x="1400" y="16" class="c-accent" font-weight="bold" text-anchor="end">86%</text>
    </g>

    <!-- Item 5: Git -->
    <g transform="translate(0, 180)">
      <text x="0" y="16" class="c-text" font-weight="500">Git</text>
      <text x="180" y="16">
        <tspan class="c-accent">█████████████████████████████████████████</tspan><tspan class="c-dim">░░</tspan>
      </text>
      <text x="1400" y="16" class="c-accent" font-weight="bold" text-anchor="end">96%</text>
    </g>

    <!-- Item 6: C / C++ -->
    <g transform="translate(0, 225)">
      <text x="0" y="16" class="c-text" font-weight="500">C / C++</text>
      <text x="180" y="16">
        <tspan class="c-accent">█████████████████████████████████████</tspan><tspan class="c-dim">░░░░░░</tspan>
      </text>
      <text x="1400" y="16" class="c-accent" font-weight="bold" text-anchor="end">84%</text>
    </g>

    <!-- Item 7: TypeScript -->
    <g transform="translate(0, 270)">
      <text x="0" y="16" class="c-text" font-weight="500">TypeScript</text>
      <text x="180" y="16">
        <tspan class="c-accent">█████████████████████████████████████</tspan><tspan class="c-dim">░░░░░░</tspan>
      </text>
      <text x="1400" y="16" class="c-accent" font-weight="bold" text-anchor="end">85%</text>
    </g>

  </g>
</svg>
