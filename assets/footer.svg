<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 180" width="100%" height="100%">
  <defs>
    <style>
      <![CDATA[
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');

        .font-mono { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }

        .c-bg { fill: #0D1117; }
        .c-surface { fill: #161B22; }
        .c-text { fill: #F5F5F5; }
        .c-muted { fill: #8B949E; }
        .c-dim { fill: #484F58; }
        .c-accent { fill: #58A6FF; }

        @keyframes pulseDot {
          0%, 100% { fill: #3FB950; }
          50% { fill: #8B949E; }
        }

        .dot-pulse { animation: pulseDot 2s infinite; }
      ]]>
    </style>
  </defs>

  <rect width="1600" height="180" class="c-bg"/>

  <!-- Neovim / Tmux Statusline Bar -->
  <g transform="translate(30, 40)">
    <rect width="1540" height="42" fill="#161B22" rx="6" stroke="#30363D" stroke-width="1.5"/>

    <!-- Mode Badge -->
    <rect width="120" height="42" fill="#58A6FF" rx="6"/>
    <text x="60" y="26" class="font-mono" fill="#0D1117" font-size="13" font-weight="bold" text-anchor="middle">NORMAL</text>

    <!-- Git Branch -->
    <rect x="130" y="8" width="120" height="26" fill="#0D1117" rx="4"/>
    <text x="190" y="25" class="font-mono c-text" font-size="12" text-anchor="middle"> main</text>

    <!-- File info & Status -->
    <text x="270" y="26" class="font-mono c-text" font-size="12">profile/README.md [modified=false]</text>

    <!-- Right Side Statusline Metadata -->
    <g transform="translate(1520, 26)" class="font-mono" font-size="12" text-anchor="end">
      <text x="0" y="0">
        <tspan class="c-muted">utf-8</tspan> <tspan class="c-dim">│</tspan>
        <tspan class="c-muted">unix</tspan> <tspan class="c-dim">│</tspan>
        <tspan class="c-accent">100%</tspan> <tspan class="c-dim">│</tspan>
        <tspan class="c-text">31:80</tspan> <tspan class="c-dim">│</tspan>
        <tspan class="c-muted">exit 0</tspan>
      </text>
    </g>
  </g>

  <!-- Bottom Terminal Session End Line -->
  <g transform="translate(800, 130)" class="font-mono">
    <circle cx="-190" cy="-4" r="4" class="dot-pulse"/>
    <text x="0" y="0" class="c-muted" font-size="13" text-anchor="middle" letter-spacing="1">
      [ SESSION TERMINATED ] — SEE YOU IN THE NEXT COMMIT
    </text>
    <circle cx="190" cy="-4" r="4" class="dot-pulse"/>
    <text x="0" y="24" class="c-dim" font-size="11" text-anchor="middle">
      amitabh_morey @ github.com — 2026
    </text>
  </g>
</svg>
