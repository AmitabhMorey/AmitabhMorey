<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" width="100%" height="100%">
  <defs>
    <style>
      <![CDATA[
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');

        .font-mono { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }

        .c-bg { fill: #0D1117; }
        .c-surface { fill: #161B22; }
        .c-text { fill: #F5F5F5; }
        .c-muted { fill: #8B949E; }
        .c-dim { fill: #484F58; }
        .c-accent { fill: #58A6FF; } /* Accent 1: Blue */

        @keyframes cursorBlink {
          0%, 49% { opacity: 1; }
          50%, 100% { opacity: 0; }
        }

        .blk-cursor { animation: cursorBlink 0.9s infinite; }
      ]]>
    </style>
  </defs>

  <rect width="1600" height="480" class="c-bg"/>

  <!-- Terminal Window Frame -->
  <rect x="30" y="20" width="1540" height="440" rx="8" class="c-surface" stroke="#30363D" stroke-width="1.5"/>

  <!-- Header Bar -->
  <path d="M 30 28 A 8 8 0 0 1 38 20 L 1562 20 A 8 8 0 0 1 1570 28 L 1570 54 L 30 54 Z" fill="#0D1117"/>
  <line x1="30" y1="54" x2="1570" y2="54" stroke="#30363D" stroke-width="1.5"/>
  <text x="50" y="42" class="font-mono c-muted" font-size="12">zsh — 120x32</text>
  <text x="800" y="42" class="font-mono c-accent" font-size="12" text-anchor="middle" font-weight="bold">~/codebase (git:main)</text>

  <!-- Console Output Body -->
  <g transform="translate(60, 90)" class="font-mono" font-size="14">

    <!-- Prompt 1: pwd & whoami -->
    <text x="0" y="0">
      <tspan class="c-accent" font-weight="bold">amitabh@os</tspan><tspan class="c-muted">:</tspan><tspan fill="#58A6FF">~/codebase</tspan><tspan class="c-muted"> $</tspan> <tspan class="c-text">whoami &amp;&amp; pwd</tspan>
    </text>
    <text x="0" y="24" class="c-muted">
      amitabh_morey <tspan class="c-dim">//</tspan> Software Engineer &amp; Security Researcher
    </text>
    <text x="0" y="44" class="c-dim">
      /home/amitabh/codebase
    </text>

    <!-- Prompt 2: git status -->
    <text x="0" y="85">
      <tspan class="c-accent" font-weight="bold">amitabh@os</tspan><tspan class="c-muted">:</tspan><tspan fill="#58A6FF">~/codebase</tspan><tspan class="c-muted"> $</tspan> <tspan class="c-text">git status</tspan>
    </text>
    <text x="0" y="109" class="c-text">
      On branch <tspan class="c-accent" font-weight="bold">main</tspan>. Your branch is up to date with <tspan class="c-muted">'origin/main'</tspan>.
    </text>
    <text x="0" y="129" class="c-dim">
      nothing to commit, working tree clean
    </text>

    <!-- Prompt 3: tree -L 2 -->
    <text x="0" y="170">
      <tspan class="c-accent" font-weight="bold">amitabh@os</tspan><tspan class="c-muted">:</tspan><tspan fill="#58A6FF">~/codebase</tspan><tspan class="c-muted"> $</tspan> <tspan class="c-text">tree -L 2 --dirsfirst</tspan>
    </text>
    <g transform="translate(0, 194)" class="c-muted" font-size="13">
      <text x="0" y="0"><tspan class="c-accent">├──</tspan> <tspan class="c-text" font-weight="bold">cybersecurity/</tspan></text>
      <text x="0" y="20"><tspan class="c-accent">│   ├──</tspan> eBPF_kernel_monitor/</text>
      <text x="0" y="40"><tspan class="c-accent">│   └──</tspan> zero_day_fuzzer/</text>
      <text x="0" y="60"><tspan class="c-accent">├──</tspan> <tspan class="c-text" font-weight="bold">systems/</tspan></text>
      <text x="0" y="80"><tspan class="c-accent">│   ├──</tspan> high_speed_packet_parser/</text>
      <text x="0" y="100"><tspan class="c-accent">│   └──</tspan> memory_safe_allocator/</text>
      <text x="0" y="120"><tspan class="c-accent">└──</tspan> <tspan class="c-text" font-weight="bold">open_source/</tspan> [31 projects indexed]</text>
    </g>

    <!-- Active Line Prompt with Cursor -->
    <text x="0" y="340">
      <tspan class="c-accent" font-weight="bold">amitabh@os</tspan><tspan class="c-muted">:</tspan><tspan fill="#58A6FF">~/codebase</tspan><tspan class="c-muted"> $</tspan> <tspan class="c-text">uptime &amp;&amp; ./run_tests.sh</tspan><tspan class="blk-cursor c-accent">█</tspan>
    </text>

  </g>
</svg>
